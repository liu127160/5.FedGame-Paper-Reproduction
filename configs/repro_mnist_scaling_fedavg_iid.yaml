# Minimal reproduction: MNIST, IID, Scaling attack with FedAvg.
# Paper-aligned changes from mnist_fedavg.yaml: epochs=200, lr=0.01.
task: MNIST_FedAvg
synthesizer: Pattern
random_seed: 0

batch_size: 64
test_batch_size: 100
lr: 0.01
momentum: 0.9
decay: 0.0005
epochs: 200
save_on_epochs: [100, 200, 300]
optimizer: SGD
log_interval: 100
scheduler: False

poisoning_proportion: 1
backdoor_label: 8

loss_balance: fixed
fixed_scales: {'backdoor': 0.5, 'normal': 0.5}

save_model: True
log: True
tb: True

transform_train: True

fl: True
fl_no_models: 10
fl_local_epochs: 2
fl_total_participants: 10
fl_eta: 1
fl_q: 0.1
fl_number_of_adversaries: 6
fl_weight_scale: 1.6667

loss_tasks:
  - backdoor
  - normal
